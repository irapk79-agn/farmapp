<!DOCTYPE html>
<html>
<head>
    <title>Farm Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; background: #eef7ee; display: flex;
               align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 320px; }
        h1 { margin: 0 0 20px; color: #2e7d32; font-size: 22px; }
        input { width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid #ccc;
                border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none;
                 border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1b5e20; }
        .error { color: #c62828; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <form class="card" method="post">
        {% csrf_token %}
        <h1>🌱 Farm Portal</h1>
        {% if messages %}
            {% for m in messages %}<div class="error">{{ m }}</div>{% endfor %}
        {% endif %}
        <input name="username" placeholder="Username" autofocus required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
</body>
</html>
